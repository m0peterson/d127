[build]
  publish = "public"

# Сайт статический, сборка не нужна. Функция netlify/functions/quote.mjs подхватывается сама
# (папка functions по умолчанию) и отвечает на /api/quote: путь и лимит запросов заданы в её коде.
# LLM-ключ, провайдер и модель лежат в переменных окружения Netlify (LLM_API_KEY, LLM_PROVIDER, LLM_MODEL),
# в репозитории их нет.

[functions]
  # Сборник кладётся внутрь пакета функции и читается с диска. Раньше функция скачивала его с собственного сайта:
  # на закрытых превью (вход в Netlify, пароль) такой запрос не проходит, и LLM не работает.
  included_files = ["public/data/quotes.txt"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # Страница ходит только на свой домен: во внешний мир ходит функция, браузер о провайдере ничего не знает.
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
